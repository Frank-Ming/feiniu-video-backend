{% extends "_base.html" %}
{% block title %}超管登录 · 飞牛短视频{% endblock %}

{% block content %}
<div class="login-wrap">
    <div class="login-card">
        <div class="logo-big">FN</div>
        <h1>飞牛短视频后台</h1>
        <p class="sub">仅超管账号可登录后台管理</p>

        {% if error %}
            <div class="alert alert-error">
                <span>⚠</span>
                <span>{{ error }}</span>
            </div>
        {% endif %}

        <form method="post" action="/admin/login">
            <input type="hidden" name="next" value="{{ next }}">
            <div class="form-group">
                <label>用户名</label>
                <input class="form-input" type="text" name="username"
                       placeholder="请输入超管账号" required autofocus>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input class="form-input" type="password" name="password"
                       placeholder="请输入密码" required>
            </div>
            <button class="btn btn-primary btn-block btn-lg" type="submit">
                登 录
            </button>
        </form>

        <p class="form-hint" style="margin-top:18px;text-align:center;">
            普通用户请在手机 App 上登录，不要在此处输入
        </p>
    </div>
</div>
{% endblock %}
