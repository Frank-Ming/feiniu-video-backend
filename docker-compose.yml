version: "3.8"

services:
  feiniu-video-api:
    build: .
    container_name: feiniu-video-api
    restart: unless-stopped
    ports:
      - "6969:6969"
    environment:
      - VIDEO_ROOT=/vol1/1000/视频/H
      - SERVER_PORT=6969
    volumes:
      # NAS 上的视频根目录（按需修改左侧路径）
      - /vol1/1000/视频/H:/vol1/1000/视频/H:ro
      # 用户数据 / 缓存 单独持久化到 Docker 应用目录
      - /vol3/1000/Docker/feiniu-video/data:/app/data
      - /vol3/1000/Docker/feiniu-video/cache:/app/cache
