name: Build Docker Image Tar

on:
  # 每次 push 到 main / master 自动构建
  push:
    branches: [main, master]
  # 也可以手动触发：Actions 页面 → Run workflow
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像 (amd64，飞牛 NAS 用)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: feiniu-video-api:latest
          outputs: type=docker
          load: true
          platforms: linux/amd64

      - name: 导出为 tar
        run: |
          docker save -o feiniu-video-api.tar feiniu-video-api:latest
          ls -lh feiniu-video-api.tar

      - name: 上传 tar 作为 artifact
        uses: actions/upload-artifact@v4
        with:
          name: feiniu-video-api-tar
          path: feiniu-video-api.tar
          if-no-files-found: error
          retention-days: 14
